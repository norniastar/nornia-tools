# 测速用：在仓库 nginx.conf 基础上打开压缩，模拟线上 Cloudflare 的 br/gzip，前后版本同一口径
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript image/svg+xml application/json;
  location / {
    try_files $uri $uri/ /index.html;
  }
}
