server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  # 站点在宿主机 Nginx / Cloudflare 之后，重定向用相对地址，避免跳到 http 或内部端口
  absolute_redirect off;

  # 仅规范化原始请求，避免 index / error_page 内部跳转触发重定向
  if ($request_uri ~ "^/index\.html(?:\?.*)?$") {
    return 301 /$is_args$args;
  }
  if ($request_uri ~ "^/(?!404\.html(?:\?|$))([^/?]+)\.html(?:\?.*)?$") {
    return 301 /$1$is_args$args;
  }

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

  # 静态导出：/json 对应 json.html；HTML 每次回源校验，保证发布后立即生效
  location / {
    # 统一去掉结尾斜杠，与 canonical 保持一致
    rewrite ^/(.+)/$ /$1 permanent;
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache";
  }

  # 带内容哈希的构建产物，可长期缓存
  location /_next/static/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 构建时生成的分享图没有扩展名
  location = /opengraph-image {
    default_type image/png;
    add_header Cache-Control "public, max-age=86400";
  }

  error_page 404 /404.html;

  location = /404.html {
    internal;
  }

  location /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }
}
