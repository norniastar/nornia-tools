name: Verify, Publish And Deploy
run-name: ${{ github.event_name == 'workflow_dispatch' && format('历史镜像 {0} / 请求 {1}', inputs.image_sha, inputs.request_id) || format('发布 {0}', github.sha) }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_sha:
        description: 已发布镜像的完整提交 SHA（不重新构建）
        required: true
        type: string
      request_id:
        description: 请求追踪编号
        required: false
        type: string
      actor_id:
        description: Dashboard 操作用户 ID
        required: false
        type: string

permissions:
  contents: read

# 构建、部署、清理共用同一并发组；不终止正在执行的发布。
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run build

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image coordinates
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # 单平台应用不生成独立证明清单，包列表以一个版本对应一个镜像。
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: always() && github.ref == 'refs/heads/main' && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch')
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://tools.nornia.top/
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Validate target and deployment settings
        id: target
        uses: actions/github-script@v9
        env:
          TARGET_SHA: ${{ inputs.image_sha || github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
        with:
          script: |
            const sha = process.env.TARGET_SHA;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('需要完整的小写提交 SHA');
            for (const key of ['VPS_HOST', 'VPS_USER', 'VPS_SSH_KEY', 'VPS_SSH_FINGERPRINT']) {
              if (!process.env[key]) throw new Error(`缺少 production Secret: ${key}`);
            }
            if (process.env.VPS_USER !== 'deploy') throw new Error('必须使用受限 deploy 用户');
            if (context.eventName === 'push') {
              const {data} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
              if (data.commit.sha !== sha) { core.setOutput('deploy', 'false'); return; }
            }
            core.setOutput('sha', sha);
            core.setOutput('deploy', 'true');
      - name: Create image deployment record
        id: release
        if: steps.target.outputs.deploy == 'true'
        uses: actions/github-script@v9
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          ACTOR_ID: ${{ inputs.actor_id }}
        with:
          script: |
            const {data} = await github.rest.repos.createDeployment({
              ...context.repo, ref: process.env.TARGET_SHA, auto_merge: false,
              required_contexts: [], environment: 'vps-production', production_environment: true,
              payload: { requestId: process.env.REQUEST_ID, actorId: process.env.ACTOR_ID,
                runId: context.runId, source: context.eventName }
            });
            core.setOutput('id', data.id);
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: data.id, state: 'in_progress', auto_inactive: false,
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Deploy existing image on VPS
        id: ssh
        if: steps.target.outputs.deploy == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 57622
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          command_timeout: 20m
          script: sudo -n /usr/local/sbin/nornia-release nornia-tools ${{ steps.target.outputs.sha }}
      - name: Record deployment result
        if: always() && steps.release.outputs.id != ''
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_ID: ${{ steps.release.outputs.id }}
          SSH_OUTCOME: ${{ steps.ssh.outcome }}
        with:
          script: |
            const success = process.env.SSH_OUTCOME === 'success';
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: success ? 'success' : 'failure', auto_inactive: false,
              environment_url: 'https://tools.nornia.top/',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: success ? '目标镜像已通过 VPS 健康检查' : '发布失败；查看日志确认旧镜像恢复结果'
            });
      - name: Check public entry
        if: steps.ssh.outcome == 'success'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 57622
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          command_timeout: 2m
          script: ci-public-check
      - name: Purge Cloudflare cache
        if: steps.ssh.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        with:
          script: |
            try {
              if (!process.env.CF_API_TOKEN || !process.env.CF_ZONE_ID) {
                throw new Error('缺少 production Secret: CF_API_TOKEN 或 CF_ZONE_ID');
              }
              const paths = ['/', '/json', '/timestamp', '/uuid', '/text-code-diff',
                '/url-codec', '/calculator', '/robots.txt', '/sitemap.xml', '/icon.svg', '/opengraph-image', '/indexnow.txt'];
              const response = await fetch(`https://api.cloudflare.com/client/v4/zones/${process.env.CF_ZONE_ID}/purge_cache`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${process.env.CF_API_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ files: paths.map(path => `https://tools.nornia.top${path}`) }),
                signal: AbortSignal.timeout(30000),
              });
              const result = await response.json();
              if (!response.ok || result.success !== true) {
                throw new Error(`Cloudflare 清缓存失败（HTTP ${response.status}）`);
              }
              core.info('已请求清除站点入口、工具页和 SEO 资源缓存');
            } catch (error) {
              core.warning(error instanceof Error ? error.message : 'Cloudflare 清缓存失败');
            }
      - name: Notify IndexNow
        if: steps.ssh.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            try {
              const origin = 'https://tools.nornia.top';
              const keyLocation = `${origin}/indexnow.txt`;
              const keyResponse = await fetch(keyLocation, { signal: AbortSignal.timeout(30000) });
              if (!keyResponse.ok) throw new Error(`读取 IndexNow 验证文件失败（HTTP ${keyResponse.status}）`);
              const key = (await keyResponse.text()).trim();
              if (!/^[a-f0-9]{32}$/.test(key)) throw new Error('IndexNow 验证文件格式不正确');
              const sitemapResponse = await fetch(`${origin}/sitemap.xml`, { signal: AbortSignal.timeout(30000) });
              if (!sitemapResponse.ok) throw new Error(`读取 sitemap 失败（HTTP ${sitemapResponse.status}）`);
              const sitemap = await sitemapResponse.text();
              const urlList = [...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map(match => {
                const url = new URL(match[1]);
                if (url.origin !== origin) throw new Error('sitemap 包含站点之外的网址');
                return url.href;
              });
              if (!urlList.length) throw new Error('sitemap 中没有可提交的网址');
              const response = await fetch('https://api.indexnow.org/indexnow', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=utf-8' },
                body: JSON.stringify({ host: new URL(origin).host, key, keyLocation, urlList }),
                signal: AbortSignal.timeout(30000),
              });
              if (response.status === 200) {
                core.info(`IndexNow 已接收 ${urlList.length} 个网址，不代表已收录`);
              } else if (response.status === 202) {
                core.warning('IndexNow 已接收请求，网站密钥仍待验证');
              } else {
                throw new Error(`IndexNow 提交失败（HTTP ${response.status}）`);
              }
            } catch (error) {
              core.warning(error instanceof Error ? error.message : 'IndexNow 提交失败');
            }
