name: Cleanup Old Images
on:
  schedule:
    - cron: '37 4 * * 0'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  deployments: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const cleanup = require('./.github/scripts/cleanup-packages.cjs');
            await cleanup({github, context, core});
